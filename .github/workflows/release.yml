# Builds the MSI on Windows and publishes it to the Releases page.
#   - Publish a release on GitHub for a tag like v1.0.0, or push such a tag -> builds, then fills in
#     that release with the MSI, its SHA-256 checksum and notes from .github/RELEASE_TEMPLATE.md.
#   - Run it by hand (Actions > Release MSI > Run workflow) -> builds and keeps the MSI as a run artifact only.
name: Release MSI

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

# Publishing a release on the website can also fire the tag push; run those one after another.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          npm version $v --no-git-tag-version --allow-same-version

      - name: Publish the app and build the MSI
        run: npm run package

      - name: Checksum and release notes
        id: notes
        shell: pwsh
        run: |
          $msi = Get-ChildItem build/msi -Recurse -Filter *.msi | Select-Object -First 1
          if (-not $msi) { throw "No MSI was built." }
          $hash = (Get-FileHash $msi.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($msi.Name)" | Out-File -Encoding ascii "$($msi.FullName).sha256"
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $runUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          (Get-Content .github/RELEASE_TEMPLATE.md -Raw) `
            -replace '\{\{VERSION\}\}', "v$version" `
            -replace '\{\{MSI\}\}', $msi.Name `
            -replace '\{\{SHA256\}\}', $hash `
            -replace '\{\{RUN_URL\}\}', $runUrl |
            Out-File -Encoding utf8 build/release-notes.md
          "msi=$($msi.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "$($msi.Name)  $hash"

      - uses: actions/upload-artifact@v5
        with:
          name: TheRevitMatrix-msi
          path: |
            build/msi/**/*.msi
            build/msi/**/*.sha256

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: The Revit Matrix ${{ github.ref_name }}
          body_path: build/release-notes.md
          overwrite_files: true
          files: |
            build/msi/**/*.msi
            build/msi/**/*.sha256
